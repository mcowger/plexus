name: Regenerate Repomap

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repomap.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-repomap
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate repomap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          cache: true
          install_args: bun github:universal-ctags/ctags-nightly-build

      - name: Generate and push repomap
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            bun run generate:repomap

            if git diff --quiet -- .repomap.txt; then
              exit 0
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .repomap.txt
            git commit -m 'chore: regenerate repomap'

            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo 'Unable to push the repomap after 5 attempts.' >&2
              exit 1
            fi

            sleep "$((attempt * 2))"
          done
