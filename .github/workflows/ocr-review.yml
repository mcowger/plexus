# OpenCodeReview PR Review (primary reviewer; Cora is a manual-only fallback, see cora-review.yml)
#
# Decisions behind this workflow (grilled and agreed):
# - Reusable action floats on `alibaba/open-code-review@main` with `ocr_version: latest`.
#   Pinning only the action does NOT freeze the CLI, so floating both is the
#   accepted trade-off: zero maintenance, review behavior may drift with releases.
# - Model is claude-opus-5-5 via the existing LLM_API_HOST / LLM_API_KEY secrets (same
#   gateway Cora used, but over the Anthropic Messages API at /v1/messages).
# - `llm_extra_body` sets `output_config.effort: high` (Anthropic thinking level).
#   `llm_reasoning_effort` is NOT used: the action rejects it on the Anthropic
#   protocol, since the Anthropic API drops unknown body fields.
# - Blocking gate is custom (OCR has no `should_block`): critical/high severities fail
#   the job in "Report OCR verdict" below. Medium stays advisory.
# - Low-severity suppression is layered: the project rule asks OCR to omit lows, and
#   `route_severity_below: low` moves any that slip through out of inline threads into
#   the action's sticky summary (the action's routing is fail-open and never drops a
#   finding, and OCR has no severity filter). Lows never gate or appear in our verdict.
# - Findings live in the action's inline comments and sticky summary. Our own comment
#   (marker below) carries only the verdict, so findings are not posted twice.

name: OpenCodeReview PR Review
run-name: 'OCR Review: PR #${{ github.event.pull_request.number || github.event.issue.number }}'

# Matching events share a per-PR group; unrelated comments use a unique noop group.
# Only explicit reruns cancel an active review. Automatic repeats queue behind it
# so they cannot interrupt the first review before checking its persistent marker.
# GitHub keeps one pending run per group, so a new event can replace a queued rerun.
concurrency:
  group: >-
    ${{
      (
        github.event_name == 'pull_request_target'
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && github.event.comment.user.type != 'Bot'
          && (
            github.event.comment.author_association == 'MEMBER'
            || github.event.comment.author_association == 'OWNER'
            || github.event.comment.author_association == 'COLLABORATOR'
          )
          && (
            startsWith(github.event.comment.body, '/open-code-review')
            || startsWith(github.event.comment.body, '@open-code-review')
          )
        )
      )
      && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'issue_comment' }}

on:
  # pull_request_target (not pull_request) so secrets are available for fork PRs.
  # Safe: the action checks out the trusted base and only reads the head diff.
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ocr-review:
    name: OCR Review
    runs-on: ubuntu-latest
    # Must stay >= review_task_timeout below: the job timeout killed a review
    # that still had task budget left. Keep the two in step.
    timeout-minutes: 15
    # Drafts are skipped until ready for review (Cora parity). On-demand
    # /open-code-review comments from collaborators always run (explicit request).
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false)
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      - name: Check whether OCR should run
        id: review-gate
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              core.setOutput('should_run', 'true');
              return;
            }

            const marker = '<!-- ocr-review-detail -->';
            const prNumber = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]'
              && comment.body?.includes(marker),
            );
            if (existing) {
              core.info('OCR has already run or started for this PR. Use /open-code-review to rerun it.');
              core.setOutput('should_run', 'false');
              return;
            }

            // Claim the automatic attempt before starting OCR, including failed or cancelled runs.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: [
                marker,
                '## OpenCodeReview',
                '',
                'The one-time automatic review has started.',
                'To request another review, comment `/open-code-review`.',
              ].join('\n'),
            });
            core.setOutput('should_run', 'true');

      - name: Get PR context
        id: pr-context
        if: steps.review-gate.outputs.should_run == 'true' && github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);

      - name: Normalize LLM endpoint URL
        id: llm
        if: steps.review-gate.outputs.should_run == 'true'
        env:
          LLM_API_HOST: ${{ secrets.LLM_API_HOST }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_HOST" ]; then
            echo "::error::LLM_API_HOST is not configured"
            exit 1
          fi
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::LLM_API_KEY is not configured"
            exit 1
          fi
          base="${LLM_API_HOST%/}"
          case "$base" in
            */v1) ;;
            *) base="$base/v1" ;;
          esac
          # Unlike Cora (which takes a base URL), OCR wants the full
          # endpoint URL. The Anthropic protocol speaks /v1/messages.
          echo "url=$base/messages" >> "$GITHUB_OUTPUT"

      - name: Run OpenCodeReview
        id: ocr
        if: steps.review-gate.outputs.should_run == 'true'
        uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ steps.llm.outputs.url }}
          llm_auth_token: ${{ secrets.LLM_API_KEY }}
          llm_model: claude-opus-5-5
          llm_use_anthropic: 'true'
          llm_extra_body: '{"output_config": {"effort": "high"}}'
          route_severity_below: low
          incremental: 'true'
          # Keep in step with the job timeout-minutes above.
          review_task_timeout: '15'
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}

      - name: Report OCR verdict
        # always(): a failed or partial OCR run must still report "incomplete"
        # instead of leaving the claim comment saying the review "has started".
        if: always() && steps.review-gate.outputs.should_run == 'true'
        uses: actions/github-script@v9
        env:
          REVIEW_FILE: /tmp/ocr-result.json
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ocr-review-detail -->';
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue?.number;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const severityOf = (c) => String(c.severity ?? '').toLowerCase();

            let review = null;
            try {
              review = JSON.parse(fs.readFileSync(process.env.REVIEW_FILE, 'utf8'));
            } catch {
              review = null;
            }

            // A non-success OCR step can leave a result file holding only the files
            // reviewed before the failure, so the outcome must be checked first.
            const incomplete = process.env.OCR_OUTCOME !== 'success'
              || !review
              || (review.status !== 'skipped' && !Array.isArray(review.comments));
            const skipped = !incomplete && review.status === 'skipped';
            const findings = incomplete || skipped ? [] : review.comments.filter((c) => severityOf(c) !== 'low');
            const blocking = findings.filter((c) => ['critical', 'high'].includes(severityOf(c)));

            let verdict;
            if (incomplete) {
              verdict = `⚠️ **Review incomplete — OCR did not finish cleanly, so there is no verdict.** See the [run logs](${runUrl}).`;
            } else if (skipped) {
              verdict = `⏭️ **Review skipped:** ${review.message ?? 'no message'}`;
            } else if (blocking.length > 0) {
              verdict = `⛔ **Blocked — ${blocking.length} critical/high finding(s). Merge is not advised until these are addressed.**`;
            } else {
              verdict = '✅ **Passing — no critical/high findings.**';
            }

            const lines = [marker, '## 🔍 OpenCodeReview', '', verdict];
            if (!incomplete && !skipped) {
              lines.push(
                '',
                `Reviewed ${review.summary?.files_reviewed ?? '?'} file(s); ${findings.length} finding(s) at medium or above` +
                  ` (${blocking.length} critical/high). Details are in the inline comments and the review summary.`,
              );
            }
            lines.push(
              '',
              '_Automatic review runs once per PR. Comment `/open-code-review` to request another review._',
            );
            const body = lines.join('\n');

            try {
              const prior = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const existing = prior.find((comment) =>
                comment.user?.login === 'github-actions[bot]'
                && comment.body?.includes(marker),
              );
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Could not post the OCR verdict: ${error.message}`);
            }

            if (skipped) {
              core.warning(`OCR skipped the review: ${review.message ?? 'no message'}`);
            } else if (incomplete) {
              core.setFailed('OCR review did not complete; no verdict was produced.');
            } else if (blocking.length > 0) {
              for (const c of blocking) {
                core.error(`${c.severity}: ${truncate(c.content, 200)}`, {
                  file: c.path,
                  startLine: c.start_line || c.end_line || undefined,
                });
              }
              core.setFailed(`OCR reported ${blocking.length} critical/high finding(s).`);
            }

            function truncate(value, length) {
              const text = String(value ?? '');
              return text.length > length ? `${text.slice(0, length)}...` : text;
            }
