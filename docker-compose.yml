services:
  plexus:
    build: .
    image: plexus:latest
    container_name: plexus
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      # Includes Plexus state and durable per-server local MCP data directories.
      - ./data:/app/data
    environment:
      - ADMIN_KEY=${ADMIN_KEY:?ADMIN_KEY is required}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/data/plexus.db}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LOG_LEVEL=info
      - DATA_DIR=/app/data
      - MCP_SERVERS_DATA_DIR=/app/data/mcp-servers
