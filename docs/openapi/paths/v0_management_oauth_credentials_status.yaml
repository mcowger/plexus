get:
  tags:
    - Management — OAuth
  summary: Check whether OAuth credentials exist (admin only)
  description: |
    Polls whether credentials exist for a provider/account combination.

    ## Use case

    Used by the UI to determine if a provider is "connected" (can make
    requests) or needs re-authentication.

    ## Response

    - `ready: true` — Credentials exist and the provider can be used
    - `ready: false` — No credentials found; user needs to start OAuth flow
    - `connectedAt` — When the credential was first stored (epoch ms)
    - `refreshedAt` — When the credential was last saved, by login or token
      refresh (epoch ms)
    - `expiresAt` — When the current access token expires (epoch ms)

    The timestamps are present only when `ready` is true and never include
    token values.

    ## Note

    This endpoint requires both `providerId` and `accountId` as query
    parameters. The credentials are keyed by both values.

    **Admin only** — limited principals receive 403.
  security:
    - AdminKey: []
  parameters:
    - in: query
      name: providerId
      required: true
      schema:
        type: string
      description: Provider ID to check.
    - in: query
      name: accountId
      required: true
      schema:
        type: string
      description: Account identifier to check.
  responses:
    '200':
      description: Status.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  ready:
                    type: boolean
                  connectedAt:
                    type: integer
                    description: First stored (epoch ms).
                  refreshedAt:
                    type: integer
                    description: Last saved by login or refresh (epoch ms).
                  expiresAt:
                    type: integer
                    description: Current access token expiry (epoch ms).
    '401':
      description: Authentication required or invalid credentials.
  operationId: getV0ManagementOauthCredentialsStatus