post:
  tags:
    - Inference — Responses
  summary: Create a Responses API response
  description: |
    OpenAI Responses API compatible, except storage defaults to false.
    Only explicit `store: true` retains a response in Plexus, for both JSON and
    streaming requests. The exact returned ID can then be retrieved or supplied
    as `previous_response_id`. Plexus replays the complete stored input and output
    history and sends upstream `store: false`, without an upstream response ID.
    An unstored response cannot be used as a predecessor, but a `store: false`
    request can reference a stored parent without retaining its own response.
    Desired top-level `instructions` must be supplied again on each turn.
    `conversation` and `previous_response_id` are mutually exclusive. Existing
    conversations can be read with omitted or false `store`, but only `store: true`
    appends the current input and output. Each stored response contains a full
    replay snapshot, so cumulative storage grows with chain history. Legacy
    responses without stored input cannot be continued.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResponsesRequest.yaml
        examples:
          first_turn:
            summary: Fresh response with simple string input
            value:
              model: smart-model
              input: Explain quantum tunneling in one sentence.
              store: true
          continued_by_id:
            summary: Continue a prior response
            value:
              model: smart-model
              previous_response_id: resp_01H...
              input: Now translate that to Spanish.
          multi_turn:
            summary: Multi-turn conversation (via conversation ID)
            value:
              model: smart-model
              conversation:
                id: conv_01H...
              input: How does that work at the cellular level?
              store: true
              temperature: 0.7
  responses:
    '200':
      description: A Responses API response.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResponsesResponse.yaml
        text/event-stream:
          schema:
            type: string
            description: Responses API SSE stream.
    '400':
      description: Invalid request, including mutually exclusive history references.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OpenAIError.yaml
    '401':
      $ref: ../components/responses/AuthError.yaml
    '404':
      description: Referenced `previous_response_id` or `conversation` not found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OpenAIError.yaml
    '429':
      $ref: ../components/responses/QuotaExceeded.yaml
    5XX:
      $ref: ../components/responses/ProviderError.yaml
  operationId: postV1Responses
