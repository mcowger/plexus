delete:
  tags: [Management — Config]
  summary: Delete an MCP server key (admin only)
  security: [{ AdminKey: [] }]
  parameters:
    - name: serverName
      in: path
      required: true
      schema: { type: string }
    - name: keyId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    '200': { $ref: ../components/responses/SuccessTrue.yaml }
    '400': { description: Invalid key ID. }
    '404': { description: MCP key not found. }
  operationId: deleteV0ManagementMcpServerKey
