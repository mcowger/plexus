post:
  tags:
    - Management — Restart
  summary: Gracefully restart the process (admin only)
  description: |
    Drains in-flight requests, then exits with status 1.

    ## Process manager assumption

    This endpoint assumes a process manager is running (systemd, Docker,
    PM2, etc.) that will automatically restart the Plexus binary after
    exit.

    ## Behaviour

    - Plexus stops accepting new connections
    - Requests arriving on open connections receive `503` with `Retry-After`
    - In-flight requests are allowed to complete for up to
      `SHUTDOWN_DRAIN_TIMEOUT_MS` (default 30 seconds); remaining
      connections are then closed
    - Server exits with code 1

    ## Forced restart

    Send `{ "force": true }` to skip the drain: every connection, including
    in-flight streams, is closed immediately. Sending `SIGTERM` to the
    process has the same effect.

    Once a restart or drain is under way, Plexus no longer accepts
    connections, so a later `{ "force": true }` request cannot reach it.
    Send `SIGTERM` or `SIGINT` to cut a running drain short.

    **Admin only** — limited principals receive 403.
  security:
    - AdminKey: []
  requestBody:
    required: false
    content:
      application/json:
        schema:
          type: object
          properties:
            force:
              type: boolean
              default: false
              description: Close connections immediately instead of draining in-flight requests.
  responses:
    '200':
      description: Restart acknowledged.
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
    '401':
      description: Authentication required or invalid credentials.
  operationId: postV0ManagementRestart
