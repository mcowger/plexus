oneOf:
  - type: object
    required: [mode, launcher, package, port]
    properties:
      mode:
        type: string
        enum: [local_http]
      enabled:
        type: boolean
        default: true
      launcher:
        type: string
        enum: [bunx, uvx]
      package:
        type: string
      args:
        type: array
        items:
          type: string
      env:
        type: object
        additionalProperties:
          type: string
        description: >-
          Environment variables passed to the local MCP process. MCP_DATA_DIR is
          managed by Plexus and cannot be set here.
      not:
        properties:
          env:
            required: [MCP_DATA_DIR]
        required: [env]
      port:
        type: integer
        minimum: 1
        maximum: 65535
      path:
        type: string
        default: /mcp
      startup_timeout_ms:
        type: integer
        minimum: 1000
        maximum: 300000
  - type: object
    required: [upstream_url]
    properties:
      mode:
        type: string
        enum: [remote_http]
      upstream_url:
        type: string
        format: uri
      enabled:
        type: boolean
        default: true
      headers:
        type: object
        additionalProperties:
          type: string
        description: Static headers forwarded upstream.
