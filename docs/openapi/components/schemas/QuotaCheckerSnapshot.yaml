type: object
description: >
  Latest quota snapshot for a single provider checker, returned by
  `GET /v0/management/quotas` and `GET /v0/management/quotas/{checkerId}`.


  A checker reports readings as an array of `Meter` objects (one per quota
  dimension). If a check fails after a successful reading is available, the
  response includes that last successful reading with `success: true`,
  `stale: true`, and the failed check's message in `error`. In that case,
  `checkedAt` is the timestamp of the returned reading, not the failed
  attempt. If there is no successful reading to reuse, `success` is false,
  `meters` is empty, and `error` carries the failure message.
properties:
  checkerId:
    type: string
    description: >
      Unique identifier for this quota checker. Format: `{provider}:{account}`,
      e.g. `naga:default`, `moonshot:work`.
  checkerType:
    type: string
    description: >
      Checker type identifier (e.g. `naga`, `moonshot`, `openai-codex`). Maps
      to the provider quota-checker definition.
  provider:
    type: string
    description: Provider identifier at capture time.
  oauthAccountId:
    type: string
    description: >
      OAuth account identifier. Present when the provider uses OAuth
      authentication. Used to distinguish multiple accounts for the same
      provider.
  oauthProvider:
    type: string
    description: >
      OAuth provider identifier (e.g. `openai-codex`, `anthropic-claude-code`).
      Present when credentials are stored via OAuth flow.
  checkedAt:
    type: string
    format: date-time
    description: >
      Timestamp represented by this result. For a stale fallback, this is the
      timestamp of the older successful reading; without a successful reading,
      it is the failed attempt's timestamp.
  success:
    type: boolean
    description: >
      Whether a successful quota snapshot is available. A stale snapshot can
      have `success: true` even though the most recent check failed.
  stale:
    type: boolean
    description: >
      Whether the returned meters come from an earlier successful check
      because the most recent check failed. Omitted for a current result.
  error:
    type: string
    description: >
      Error from the most recent failed check. Can be present with
      `success: true` when `stale` is true.
  meters:
    type: array
    items:
      $ref: ./Meter.yaml
    description: >
      Current meter readings for this checker (one `Meter` per quota
      dimension). For a stale result, these are the meters from the last
      successful reading. Can be empty when that reading reported no meters,
      or when there is no successful reading to reuse.
